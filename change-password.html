<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crips-change-password</title>
    <script src="https://kit.fontawesome.com/41d51bfab0.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="form-login">
    <img src="CRIG-LOGO1.png" alt="logo" class="log-logo">
    <p class="welcome-text">Change Your Password</p>
    <p class="login-text-direction">
      Your password was reset by an administrator. Choose a new one to continue.
    </p>

    <form id="force-password-form">
      <div class="form-group">
        <label for="force-new-password">New Password</label>
        <div class="form-input-img">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="force-new-password" autocomplete="new-password">
        </div>
      </div>

      <div class="form-group">
        <label for="force-confirm-password">Confirm Password</label>
        <div class="form-input-img">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="force-confirm-password" autocomplete="new-password">
        </div>
      </div>

      <button class="submit-btn" type="submit" id="force-password-btn">Save Password</button>

      <p class="forgot-text" id="force-password-signout" style="cursor:pointer;">Sign out instead</p>
    </form>
  </div>

  <div class="success-message-show" id="success-show"></div>

  <div class="error-message-show" id="error-show"></div>

  <p class="developer-text">Powered by: McCode Networks (mccodenetworks@gmail.com)</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./data/supabase.js" defer></script>
  <script src="./data/authenticPage.js" defer></script>
  <script src="./data/forcePasswordChange.js" defer></script>

</body>
</html>
